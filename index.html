const rows=JSON.parse(document.getElementById('data').textContent).sort((a,b)=>b.date.localeCompare(a.date));

function yearsFor(c){return [...new Set(rows.filter(r=>r.category===c).map(r=>r.date.slice(0,4)||'日期待確認'))].sort((a,b)=>a==='日期待確認'?1:b==='日期待確認'?-1:b.localeCompare(a))}

function button(label,active,fn){const b=el('button',label);b.type='button';b.setAttribute('aria-pressed',String(active));b.onclick=fn;return b}
function render(){const inCategory=category!=='全部';$('back').hidden=!inCategory;$('entrances').hidden=inCategory;$('year-area').hidden=!inCategory;$('heading').textContent=inCategory?category:'妮芙露 × 真善美成功團隊 訪談｜課程影音整理站';if(!inCategory){$('heading').replaceChildren(document.createTextNode('妮芙露 '),el('span','×','collaboration-mark'),document.createTextNode(' 真善美成功團隊 訪談｜課程影音整理站'))}$('browse').hidden=!inCategory;$('footer').hidden=!inCategory;$('description').textContent=inCategory?'選擇年份，查看當年的影片。':'找到一段分享，聽見不同的人生。';$('total').textContent=inCategory?rows.filter(r=>r.category===category).length+' 部影片':'四個節目 · '+rows.length+' 部影片';
$('categories').replaceChildren(button('全部',!inCategory,()=>go('全部')),...cats.map(c=>button(c,category===c,()=>go(c))));$('years').replaceChildren();if(inCategory){$('years').append(button('全部年份',year==='全部',()=>go(category)));for(const y of yearsFor(category))$('years').append(button(y==='日期待確認'?y:y+' 年',year===y,()=>go(category,y)))}
const found=filteredRows(category,year,$('search').value,$('pending').checked);$('result-title').textContent=(inCategory?category:'全部影片')+(year==='全部'?'':' · '+year);$('count').textContent='顯示 '+found.length+' 部 · 日期由新到舊（日期待確認置底）';$('list').replaceChildren();let prev='';
for(const r of found){const y=r.date.slice(0,4)||'日期待確認';if(inCategory&&year==='全部'&&y!==prev){$('list').append(el('h2',y==='日期待確認'?y:y+' 年','group-title'));prev=y}const row=el('article',undefined,'row'),time=el('time',r.date||'日期待確認');if(r.date)time.dateTime=r.date;const info=el('div',undefined,'info');if(r.category==='好4發生'||r.category==='週日快閃'){row.classList.add('story-row');info.append(el('h3',r.title||'標題待確認'),el('p',r.person+'｜'+(r.category==='週日快閃'?r.currentRank:(r.rank||'聘階待確認')),'guest'))}else if(r.category==='妮妮聊天室'||r.category==='溫情聊天室'){row.classList.add('story-row');info.append(el('h3',r.person+'｜'+r.currentRank))}else{info.append(el('h3',r.person));if(r.title)info.append(el('p',r.title))}if(r.note)info.append(el('p',r.note));for(const i of r.issues)info.append(el('p',i,'issue'));const a=el('a','觀看影片','watch');a.href=r.url;a.target='_blank';a.rel='noopener noreferrer';a.setAttribute('aria-label','觀看 '+r.person+' '+(r.date||'日期待確認')+' 的影片');row.append(time,info);if(!['好4發生','週日快閃','妮妮聊天室','溫情聊天室'].includes(r.category))row.append(el('div',r.category,'category'));row.append(a);$('list').append(row)}if(!found.length)$('list').append(el('p','沒有符合的影片，請更換年份或搜尋文字。'))}
